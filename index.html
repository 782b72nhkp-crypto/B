<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sherry Rashid — Personal stylist, Milano</title>
<meta name="description" content="Sherry Rashid, personal stylist e personal shopper a Milano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Inter+Tight:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3EF; --ink:#1C1C1C; --ink-2:#6B6862; --accent:#4F5A3A; --accent-ink:#F4F3EF;
  --rule:#1C1C1C; --rule-soft:#D6D3CC;
  --pad:48px; --gap:24px; --max:1440px;
  --f-display:"Inter Tight",system-ui,sans-serif;
  --f-text:"Inter",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap)}
.mono{font:400 13px/1.4 var(--f-mono);letter-spacing:.02em}
.muted{color:var(--ink-2)}
.display{font-family:var(--f-display);font-weight:500;letter-spacing:-.02em;line-height:.98}

/* ---------- Header ---------- */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--rule-soft)}
.hdr .wrap{height:72px;display:flex;align-items:center;justify-content:space-between;gap:var(--gap)}
.brand{font:500 19px/1 var(--f-display);letter-spacing:-.01em}
.nav{display:flex;gap:36px;font-size:15px}
.nav a{padding:4px 0;border-bottom:1px solid transparent}
.nav a:hover{border-color:var(--ink)}
.hdr-r{display:flex;align-items:center;gap:28px}
.lang{display:flex;gap:2px}
.lang button{padding:6px 6px;color:var(--ink-2)}
.lang button[aria-pressed="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.btn{display:inline-flex;align-items:center;gap:14px;background:var(--accent);color:var(--accent-ink);font:500 15px/1 var(--f-text);padding:16px 22px;transition:background .2s}
.btn:hover{background:#3E4730}
.btn .arr{transition:transform .2s}
.btn:hover .arr{transform:translateX(4px)}
.btn-line{display:inline-flex;align-items:center;gap:12px;font:500 15px/1 var(--f-text);padding:15px 0;border-bottom:1px solid currentColor}

/* ---------- Hero ---------- */
.hero{padding:56px 0 120px}
.hero-meta{display:flex;justify-content:space-between;padding-bottom:56px}
.hero h1{grid-column:1/-1;font-size:96px;max-width:17ch}
.hero-body{grid-column:1/-1;margin-top:72px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);align-items:start}
.hero-fig{grid-column:1/8}
.hero-side{grid-column:9/13;padding-top:4px}
.hero-side p{font-size:19px;line-height:1.5;margin-bottom:36px}
.hero-side .mono{margin-top:40px;display:block}

/* ---------- Figures ---------- */
figure{margin:0}
.ph{position:relative;background:#D3D0C9;overflow:hidden}
.ph svg{width:100%;height:100%}
figcaption{display:flex;justify-content:space-between;gap:16px;margin-top:12px}

/* ---------- Section scaffolding ---------- */
.sec{padding:120px 0;border-top:1px solid var(--rule)}
.sec-head{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);margin-bottom:72px}
.sec-head .idx{grid-column:1/4}
.sec-head h2{grid-column:4/13;font-size:64px;max-width:16ch}

/* ---------- Statement ---------- */
.statement p{grid-column:4/12;font:500 40px/1.18 var(--f-display);letter-spacing:-.02em}
.statement p em{font-style:normal;color:var(--ink-2)}

/* ---------- Services ---------- */
.svc{grid-column:1/-1;list-style:none;border-top:1px solid var(--rule)}
.svc li{border-bottom:1px solid var(--rule)}
.svc a{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);align-items:baseline;padding:36px 0}
.svc .n{grid-column:1/2}
.svc .name{grid-column:2/7;font:500 40px/1.05 var(--f-display);letter-spacing:-.02em}
.svc .name span{text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:8px;transition:text-decoration-color .2s}
.svc .desc{grid-column:7/11;color:var(--ink-2);font-size:17px}
.svc .meta{grid-column:11/12}
.svc .go{grid-column:12/13;justify-self:end;font-size:22px;transition:transform .2s,color .2s}
.svc a:hover .name span,.svc a:focus-visible .name span{text-decoration-color:var(--ink)}
.svc a:hover .go{transform:translateX(6px);color:var(--accent)}

/* ---------- Method ---------- */
.steps{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--gap)}
.step{border-top:1px solid var(--rule);padding-top:20px}
.step h3{font:500 28px/1.1 var(--f-display);letter-spacing:-.02em;margin:48px 0 16px}
.step p{color:var(--ink-2);max-width:32ch}

/* ---------- Gallery ---------- */
.gal{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:72px}
.g1{grid-column:1/6}
.g2{grid-column:7/13;margin-top:160px}
.g3{grid-column:3/7}
.g4{grid-column:8/12;margin-top:-80px}

/* ---------- About ---------- */
.about-fig{grid-column:1/5}
.about-txt{grid-column:6/12}
.about-txt h2{font-size:64px;margin-bottom:40px}
.about-txt p{margin-bottom:20px;max-width:56ch}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-top:56px;border-top:1px solid var(--rule);padding-top:20px}
.facts b{display:block;font:500 40px/1 var(--f-display);letter-spacing:-.02em;margin-bottom:10px}

/* ---------- Quote ---------- */
.quote blockquote{grid-column:4/12;font:500 40px/1.18 var(--f-display);letter-spacing:-.02em}
.quote cite{grid-column:4/12;margin-top:32px;font-style:normal}

/* ---------- Dark bands ---------- */
.dark{background:var(--ink);color:#fff}
.dark .muted{color:#A9A69F}
.dark .sec{border-top-color:#3A3A3A}
.gift .grid{align-items:end}
.gift h2{grid-column:1/8;font-size:80px;max-width:11ch}
.gift-r{grid-column:9/13}
.gift-r p{margin-bottom:32px;color:#D8D6D0}
.gift .card{grid-column:1/-1;margin-top:96px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);border-top:1px solid #3A3A3A;padding-top:20px}
.gift .card div{grid-column:span 3}
.btn-inv{background:#fff;color:var(--ink)}
.btn-inv:hover{background:#E6E4DE}

.close{border-top:1px solid #3A3A3A}
.close .sec{border-top:0;padding-bottom:64px}
.close h2{grid-column:1/-1;font-size:96px;max-width:12ch}
.close .acts{grid-column:1/-1;margin-top:64px;display:flex;gap:40px;align-items:center;flex-wrap:wrap}
.close .acts .btn-line{color:#fff}
.foot{grid-column:1/-1;margin-top:140px;padding-top:20px;border-top:1px solid #3A3A3A;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:24px}
.foot > div{grid-column:span 3}
.foot a:hover{text-decoration:underline;text-underline-offset:4px}
.foot .mono{display:block;margin-bottom:10px}

.sticky-cta{display:none}

/* ---------- Tablet ---------- */
@media (max-width:1100px){
  :root{--pad:32px}
  .hero h1,.close h2{font-size:72px}
  .gift h2{font-size:64px}
  .sec-head h2,.about-txt h2{font-size:52px}
  .nav{display:none}
}

/* ---------- Mobile ---------- */
@media (max-width:720px){
  :root{--pad:20px;--gap:16px}
  body{font-size:17px;padding-bottom:84px}
  .hdr .wrap{height:60px}
  .hdr .btn{display:none}
  .hdr-r{gap:0}
  .hero{padding:28px 0 72px}
  .hero-meta{padding-bottom:36px}
  .hero h1{font-size:48px;line-height:1}
  .hero-body{margin-top:40px;row-gap:28px}
  .hero-fig,.hero-side{grid-column:1/-1}
  .hero-side p{font-size:17px;margin-bottom:0}
  .hero-side .btn{display:none}
  .hero-side .mono{margin-top:20px}
  .sec{padding:72px 0}
  .sec-head{margin-bottom:40px;row-gap:16px}
  .sec-head .idx,.sec-head h2{grid-column:1/-1}
  .sec-head h2,.about-txt h2{font-size:44px;line-height:1}
  .statement p{grid-column:1/-1;font-size:28px}
  .svc a{grid-template-columns:28px 1fr 20px;row-gap:10px;padding:24px 0}
  .svc .n{grid-column:1;grid-row:1}
  .svc .name{grid-column:2;grid-row:1;font-size:28px}
  .svc .go{grid-column:3;grid-row:1;font-size:18px}
  .svc .desc{grid-column:2/4;grid-row:2;font-size:16px}
  .svc .meta{grid-column:2/4;grid-row:3}
  .steps{grid-template-columns:1fr;row-gap:40px}
  .step h3{margin:28px 0 10px;font-size:26px}
  .gal{row-gap:40px}
  .g1{grid-column:1/-1}
  .g2{grid-column:4/-1;margin-top:0}
  .g3{grid-column:1/10}
  .g4{grid-column:1/-1;margin-top:0}
  .about-fig{grid-column:1/9;margin-bottom:40px}
  .about-txt{grid-column:1/-1}
  .about-txt h2{margin-bottom:24px}
  .facts{gap:12px;margin-top:40px}
  .facts b{font-size:30px}
  .quote blockquote,.quote cite{grid-column:1/-1}
  .quote blockquote{font-size:28px}
  .gift h2{grid-column:1/-1;font-size:44px;line-height:1;margin-bottom:28px}
  .gift-r{grid-column:1/-1}
  .gift .card{margin-top:56px;row-gap:20px}
  .gift .card div{grid-column:span 6}
  .close h2{font-size:48px;line-height:1}
  .close .acts{margin-top:40px;gap:24px}
  .close .acts .btn{display:none}
  .foot{margin-top:80px}
  .foot > div{grid-column:span 6;min-width:0;overflow-wrap:anywhere}
  .foot > div:nth-child(2){grid-column:1/-1}
  .sticky-cta{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--rule);padding:12px 20px calc(12px + env(safe-area-inset-bottom));gap:12px;align-items:center}
  .sticky-cta .btn{flex:1;justify-content:space-between;padding:17px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a class="brand" href="#top">Sherry Rashid</a>
    <nav class="nav" aria-label="Principale">
      <a href="#servizi" data-t="nav.services"></a>
      <a href="#metodo" data-t="nav.method"></a>
      <a href="#chi-sono" data-t="nav.about"></a>
      <a href="#regalo" data-t="nav.gift"></a>
    </nav>
    <div class="hdr-r">
      <div class="lang mono" role="group" aria-label="Lingua / Language">
        <button type="button" data-lang="it" aria-pressed="true">IT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="btn" href="#contatti"><span data-t="cta.book"></span><span class="arr" aria-hidden="true">→</span></a>
    </div>
  </div>
</header>

<main id="top">

<!-- HERO -->
<section class="hero">
  <div class="wrap">
    <div class="hero-meta mono muted">
      <span data-t="hero.kicker"></span>
      <span>Milano — 45.4642° N, 9.1900° E</span>
    </div>
    <div class="grid">
      <h1 class="display" data-t="hero.title"></h1>
      <div class="hero-body">
        <figure class="hero-fig">
          <div class="ph" style="aspect-ratio:5/4">
            <svg viewBox="0 0 500 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <rect width="500" height="400" fill="#CBC8C1"/>
              <rect x="0" y="300" width="500" height="100" fill="#C2BFB7"/>
              <rect x="70" y="120" width="300" height="190" fill="#E4E2DD"/>
              <rect x="70" y="120" width="300" height="34" fill="#D8D5CF"/>
              <g stroke="#CFCCC6" stroke-width="2">
                <line x1="70" y1="180" x2="370" y2="180"/><line x1="70" y1="200" x2="370" y2="200"/>
                <line x1="70" y1="220" x2="370" y2="220"/><line x1="70" y1="240" x2="370" y2="240"/>
                <line x1="70" y1="260" x2="370" y2="260"/><line x1="70" y1="280" x2="370" y2="280"/>
              </g>
              <rect x="70" y="310" width="300" height="8" fill="#ADAAA2"/>
              <rect x="300" y="70" width="140" height="240" fill="#3A3936"/>
              <rect x="300" y="70" width="140" height="22" fill="#2C2B29"/>
              <line x1="370" y1="92" x2="370" y2="310" stroke="#2A2927" stroke-width="2"/>
              <rect x="300" y="310" width="140" height="8" fill="#252422"/>
              <circle cx="400" cy="160" r="9" fill="#8B5A34"/>
              <circle cx="400" cy="220" r="9" fill="#8B5A34"/>
            </svg>
          </div>
          <figcaption class="mono muted"><span data-t="hero.cap"></span><span>Fig. 01</span></figcaption>
        </figure>
        <div class="hero-side">
          <p data-t="hero.lede"></p>
          <a class="btn" href="#contatti"><span data-t="cta.book"></span><span class="arr" aria-hidden="true">→</span></a>
          <span class="mono muted" data-t="hero.note"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- STATEMENT -->
<section class="statement">
  <div class="wrap">
    <div class="sec grid">
      <div class="sec-head" style="margin-bottom:40px"><span class="idx mono muted">01 / <span data-t="st.idx"></span></span></div>
      <p data-t="st.text"></p>
    </div>
  </div>
</section>

<!-- SERVICES -->
<section id="servizi">
  <div class="wrap">
    <div class="sec grid">
      <div class="sec-head">
        <span class="idx mono muted">02 / <span data-t="nav.services"></span></span>
        <h2 class="display" data-t="svc.title"></h2>
      </div>
      <ul class="svc">
        <li><a href="#contatti"><span class="n mono muted">01</span><span class="name"><span data-t="s1.n"></span></span><span class="desc" data-t="s1.d"></span><span class="meta mono muted" data-t="s1.m"></span><span class="go" aria-hidden="true">→</span></a></li>
        <li><a href="#contatti"><span class="n mono muted">02</span><span class="name"><span data-t="s2.n"></span></span><span class="desc" data-t="s2.d"></span><span class="meta mono muted" data-t="s2.m"></span><span class="go" aria-hidden="true">→</span></a></li>
        <li><a href="#contatti"><span class="n mono muted">03</span><span class="name"><span data-t="s3.n"></span></span><span class="desc" data-t="s3.d"></span><span class="meta mono muted" data-t="s3.m"></span><span class="go" aria-hidden="true">→</span></a></li>
        <li><a href="#contatti"><span class="n mono muted">04</span><span class="name"><span data-t="s4.n"></span></span><span class="desc" data-t="s4.d"></span><span class="meta mono muted" data-t="s4.m"></span><span class="go" aria-hidden="true">→</span></a></li>
        <li><a href="#contatti"><span class="n mono muted">05</span><span class="name"><span data-t="s5.n"></span></span><span class="desc" data-t="s5.d"></span><span class="meta mono muted" data-t="s5.m"></span><span class="go" aria-hidden="true">→</span></a></li>
      </ul>
    </div>
  </div>
</section>

<!-- METHOD -->
<section id="metodo">
  <div class="wrap">
    <div class="sec grid">
      <div class="sec-head">
        <span class="idx mono muted">03 / <span data-t="nav.method"></span></span>
        <h2 class="display" data-t="m.title"></h2>
      </div>
      <div class="steps">
        <div class="step"><span class="mono muted">I.</span><h3 data-t="m1.t"></h3><p data-t="m1.d"></p></div>
        <div class="step"><span class="mono muted">II.</span><h3 data-t="m2.t"></h3><p data-t="m2.d"></p></div>
        <div class="step"><span class="mono muted">III.</span><h3 data-t="m3.t"></h3><p data-t="m3.d"></p></div>
      </div>
    </div>
  </div>
</section>

<!-- GALLERY -->
<section>
  <div class="wrap">
    <div class="sec grid">
      <div class="sec-head">
        <span class="idx mono muted">04 / <span data-t="g.idx"></span></span>
        <h2 class="display" data-t="g.title"></h2>
      </div>
      <div class="gal">
        <figure class="g1">
          <div class="ph" style="aspect-ratio:4/5">
            <svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <rect width="400" height="500" fill="#D6D3CC"/>
              <path d="M95 140 L305 140 L305 380 L95 380 Z" fill="#2E2D2B"/>
              <path d="M95 140 L305 140 L305 190 L95 190 Z" fill="#242321"/>
              <path d="M150 140 C150 60 250 60 250 140" fill="none" stroke="#2E2D2B" stroke-width="12"/>
              <rect x="186" y="200" width="28" height="18" fill="none" stroke="#BDB9B1" stroke-width="3"/>
              <rect x="95" y="380" width="210" height="10" fill="#B7B3AB"/>
            </svg>
          </div>
          <figcaption class="mono muted"><span data-t="g1"></span><span>Fig. 02</span></figcaption>
        </figure>
        <figure class="g2">
          <div class="ph" style="aspect-ratio:3/2">
            <svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <rect width="600" height="400" fill="#C9C6BF"/>
              <circle cx="235" cy="200" r="62" fill="none" stroke="#1F1E1C" stroke-width="9"/>
              <circle cx="375" cy="200" r="62" fill="none" stroke="#1F1E1C" stroke-width="9"/>
              <path d="M290 192 Q305 176 320 192" fill="none" stroke="#1F1E1C" stroke-width="7"/>
              <line x1="173" y1="190" x2="110" y2="176" stroke="#1F1E1C" stroke-width="7"/>
              <line x1="437" y1="190" x2="500" y2="176" stroke="#1F1E1C" stroke-width="7"/>
              <rect x="0" y="330" width="600" height="70" fill="#BEBBB3"/>
            </svg>
          </div>
          <figcaption class="mono muted"><span data-t="g2"></span><span>Fig. 03</span></figcaption>
        </figure>
        <figure class="g3">
          <div class="ph" style="aspect-ratio:1/1">
            <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <rect width="400" height="400" fill="#DCD9D3"/>
              <rect x="40" y="186" width="320" height="28" fill="#3B3A37"/>
              <rect x="300" y="178" width="34" height="44" fill="none" stroke="#9A968E" stroke-width="5"/>
              <line x1="300" y1="200" x2="334" y2="200" stroke="#9A968E" stroke-width="4"/>
              <circle cx="250" cy="200" r="4" fill="#DCD9D3"/><circle cx="220" cy="200" r="4" fill="#DCD9D3"/><circle cx="190" cy="200" r="4" fill="#DCD9D3"/>
              <rect x="40" y="186" width="18" height="28" fill="#7E2A22"/>
            </svg>
          </div>
          <figcaption class="mono muted"><span data-t="g3"></span><span>Fig. 04</span></figcaption>
        </figure>
        <figure class="g4">
          <div class="ph" style="aspect-ratio:4/5">
            <svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <rect width="400" height="500" fill="#CECBC4"/>
              <path d="M60 120 L340 120 L340 400 L60 400 Z" fill="#EDEBE6"/>
              <path d="M60 120 L340 400 L60 400 Z" fill="#E0DED8"/>
              <line x1="60" y1="120" x2="340" y2="400" stroke="#CFCCC5" stroke-width="2"/>
              <rect x="60" y="120" width="280" height="280" fill="none" stroke="#B5B1A9" stroke-width="2"/>
              <rect x="300" y="360" width="40" height="40" fill="#4F5A3A"/>
            </svg>
          </div>
          <figcaption class="mono muted"><span data-t="g4"></span><span>Fig. 05</span></figcaption>
        </figure>
      </div>
    </div>
  </div>
</section>

<!-- ABOUT -->
<section id="chi-sono">
  <div class="wrap">
    <div class="sec grid">
      <figure class="about-fig">
        <div class="ph" style="aspect-ratio:3/4">
          <svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <rect width="300" height="400" fill="#BDBAB3"/>
            <rect x="0" y="0" width="300" height="400" fill="#C7C4BD"/>
            <rect x="96" y="70" width="108" height="330" fill="#2F2E2C"/>
            <circle cx="150" cy="70" r="40" fill="#8F8C86"/>
          </svg>
        </div>
        <figcaption class="mono muted"><span>Sherry Rashid</span><span data-t="a.cap"></span></figcaption>
      </figure>
      <div class="about-txt">
